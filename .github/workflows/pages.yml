name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Build the site
        working-directory: web/app
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build -- --outDir ../site --emptyOutDir

      # The wasm engine, its JS shim, and the season data go straight into
      # the site output so the normal embedded build never carries them.
      - name: Add the WebAssembly engine and data
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o web/site/overcut.wasm ./cmd/overcut-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/site/wasm_exec.js
          mkdir -p web/site/data
          cp data/season2026.json web/site/data/season.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
